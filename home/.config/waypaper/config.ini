[Settings]
folder = ~/Pictures/Wallpapers
wallpaper = ~/Pictures/Wallpapers/wallhaven-vpqpem.png
backend = feh
monitors = All
fill = fill
sort = name
subfolders = False
show_hidden = False
# Also copy the chosen image to the file i3 loads at login (and that lives in ~/dotfiles)
post_command = cp "$wallpaper" ~/.config/i3/wallpaper.png
