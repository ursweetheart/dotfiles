# Mouse feel like Windows' default: pointer speed slider in the middle,
# "Enhance pointer precision" on.
#   AccelSpeed   -1.0 (slowest) .. 1.0 (fastest), 0 = middle
#   AccelProfile "adaptive" = acceleration on, "flat" = off (raw, for gaming)
# Installed to /etc/X11/xorg.conf.d/30-mouse.conf by install.sh.
Section "InputClass"
    Identifier "mouse like windows default"
    MatchIsPointer "on"
    MatchIsTouchpad "off"
    MatchDriver "libinput"
    Option "AccelSpeed" "0"
    Option "AccelProfile" "adaptive"
EndSection
