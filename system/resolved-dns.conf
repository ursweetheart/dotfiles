# Use Cloudflare + Google DNS over TLS instead of the ISP's DNS.
# Some Vietnamese ISPs block Steam (and other sites) at the DNS level.
# Installed to /etc/systemd/resolved.conf.d/dns.conf by install.sh.
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 8.8.8.8#dns.google 2606:4700:4700::1111#cloudflare-dns.com
FallbackDNS=9.9.9.9#dns.quad9.net
DNSOverTLS=yes
Domains=~.
